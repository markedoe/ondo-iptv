# Shared lint rules for the app, the core package and the tests.
included:
  - App
  - AppTests
  - UITests
  - MacUITests
  - Packages/IPTVCore/Sources
  - Packages/IPTVCore/Tests
excluded:
  - build
  - Packages/IPTVCore/.build

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo
  - nesting
  - trailing_comma
  - opening_brace          # SwiftUI trailing-closure layouts
  - multiple_closures_with_trailing_closure
  # Provider data is decoded leniently on purpose (invalid UTF-8 bytes become U+FFFD instead of failing).
  - optional_data_string_conversion

line_length:
  warning: 200   # localized sentences stay on one line
  error: 260
  ignores_urls: true
  ignores_comments: true
type_body_length:
  warning: 600
  error: 1100
file_length:
  warning: 1000
  error: 1600
function_body_length:
  warning: 120
  error: 250
cyclomatic_complexity:
  warning: 20
  error: 40
large_tuple:
  warning: 4
identifier_name:
  min_length: 1
  max_length: 60
  excluded: [id, x, y, i, c, a, b, d, n, p, r, s, t, w]
type_name:
  max_length: 60
force_cast: warning
force_try: warning

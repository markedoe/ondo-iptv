<!doctype html>
<!--
  Ondo's Android TV banners, drawn by render.mjs (--tv): the launcher banner (320 × 180 at xhdpi, 640 × 360 at
  xxxhdpi for 4K screens) and the Google Play listing's TV banner (1280 × 720). The launcher banner must carry the
  app's name (Google's TV app quality, TV-BN). The logo is the launcher icon's (ic_launcher_foreground.xml).
  tv-banner.html?width=320&height=180
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter Display", "Inter", sans-serif;
    background: #000000;
  }
  svg { display: block; }
  span { color: #ffffff; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
</style>
</head>
<body>
<!-- The logo's ring and wave, cropped to the ring (the icon's 108 × 108 canvas keeps a safe margin around it). -->
<svg id="logo" viewBox="26 26 56 56" aria-hidden="true">
  <circle cx="54" cy="54" r="21.10" fill="none" stroke="#ffffff" stroke-width="8.28"/>

</svg>
<span id="name">Ondo</span>
<script>
  const params = new URLSearchParams(location.search);
  const width = Number(params.get("width") || 320);
  const height = Number(params.get("height") || 180);
  document.documentElement.style.width = width + "px";
  document.documentElement.style.height = height + "px";
  // Proportions of the 320 × 180 banner, scaled: logo, gap and name side by side, centred.
  const unit = height / 180;
  const logo = document.getElementById("logo");
  logo.style.width = logo.style.height = 92 * unit + "px";
  logo.style.marginRight = 18 * unit + "px";
  document.getElementById("name").style.fontSize = 70 * unit + "px";
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>

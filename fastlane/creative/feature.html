<!doctype html>
<!--
  The Google Play listing's feature graphic (1024 × 500), drawn by render.mjs (--tv) in each listing language:
  feature.html?locale=en-US|fr-FR. Google shows it behind a play button on some screens: the logo, the name and a
  short phrase stay in the middle. The logo is the launcher icon's (ic_launcher_foreground.xml).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    font-family: "Inter Display", "Inter", sans-serif;
    /* Pure black, a faint light behind the logo. */
    background: radial-gradient(ellipse 50% 60% at 50% 42%, rgba(255, 255, 255, 0.08), transparent 70%), #000000;
  }
  .brand { display: flex; align-items: center; gap: 26px; }
  svg { display: block; width: 150px; height: 150px; }
  .name { color: #ffffff; font-size: 120px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
  .line { color: #8e8e93; font-family: "Inter", sans-serif; font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="brand">

  <span class="name">Ondo</span>
</div>
<p class="line" id="line"></p>
<script>
  // What Ondo is, never "free" (CLAUDE.md): a player for the viewer's own playlist.
  const lines = {
    "en-US": "Movies, series and live TV from your own playlist",
    "fr-FR": "Films, séries et TV en direct depuis votre playlist",
  };
  const locale = new URLSearchParams(location.search).get("locale") || "en-US";
  document.getElementById("line").textContent = lines[locale];
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>

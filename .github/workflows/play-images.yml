name: Google Play images

# The Google Play listing's images alone, in each listing language: the screenshots (phone, 7" and 10" tablets, TV)
# rendered by the screenshot tests in that language, and the feature graphic, TV banner and icon of
# fastlane/metadata-android/<locale>/images. No build, no track or release change, no listing text, no release notes
# (Fastfile, lane listing_images). upload: no (the default) renders the images and keeps them in the
# google-play-images artifact, to look at first. upload: yes also sends them; the commit uses ERROR_IF_IN_REVIEW: while
# Google reviews something (closed testing, the listing, the Android TV opt-in), Google Play refuses it, nothing
# changes and the review goes on; otherwise the new images go to Google's review of the listing.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Listing languages, separated by spaces, or all"
        type: string
        default: "es-ES es-419 pt-BR zh-CN ar hi-IN"
      upload:
        description: "no: render the images into the google-play-images artifact only; yes: also send them to Google Play"
        type: choice
        default: "no"
        options: ["no", "yes"]

permissions:
  contents: read

jobs:
  render:
    name: Render the listing images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No secret in this job: the tests run third-party code (test libraries, Robolectric).
    env:
      LANGUAGES: ${{ github.event.inputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Listing screenshots
        working-directory: android
        run: ./gradlew :app:recordRoborazziDebug --tests "com.markedoe.ondo.screenshots.PlayStoreScreenshots" --stacktrace
      - name: Into the listing
        # Every language asked for gets each kind of screenshot (es-419 the Spanish ones), or the run stops here.
        run: |
          # all: every language of the listing.
          if [ "$LANGUAGES" = all ]; then LANGUAGES=""; fi
          python3 -I .github/scripts/listing_screenshots.py --only "$LANGUAGES" android/app/src/test/screenshots/play fastlane/metadata-android
          mkdir images
          for language in ${LANGUAGES:-$(ls fastlane/metadata-android)}; do
            for file in featureGraphic.png tvBanner.png icon.png; do
              [ -f "fastlane/metadata-android/$language/images/$file" ] || { echo "::error::$language: images/$file is missing"; exit 1; }
            done
            cp -R "fastlane/metadata-android/$language" "images/$language"
            rm -f images/"$language"/*.txt
            rm -rf "images/$language/changelogs"
          done
          find images -name "*.png" | sort
      - name: No metadata in the images
        # Only the chunks that draw the image stay (the listing is public).
        run: find images -name "*.png" -print0 | xargs -0 -r python3 -I .github/scripts/png_metadata.py
      - name: Images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-images
          path: images

  upload:
    name: Google Play
    needs: render
    if: github.event.inputs.upload == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Never during an upload or a promotion: all of them edit the same Google Play app.
    concurrency:
      group: release-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-play-images
          path: images
      - name: Images in the listing folder
        # The images rendered and checked above, in place of the listing's (texts are not sent).
        run: |
          for language in images/*/; do
            language=$(basename "$language")
            rm -rf "fastlane/metadata-android/$language/images"
            cp -R "images/$language/images" "fastlane/metadata-android/$language/images"
          done
          find fastlane/metadata-android -name "*.png" | sort
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Send the images
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing. See docs/RELEASE-ANDROID.md."
            exit 1
          fi
          # The languages rendered above, nothing else.
          LANGUAGES="$(ls images | tr '\n' ' ')" bundle exec fastlane android listing_images

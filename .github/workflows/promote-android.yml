name: Promote Android

# Moves a version already in internal testing (the bundle testers checked) to closed or open testing, as a draft
# to review and roll out in the Play Console: no new build, same version code. Production comes from an
# android-v* tag (Release Android).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code in internal testing (e.g. 1004)"
        required: true
        type: string
      track:
        description: "Track to promote to (alpha = closed testing, beta = open testing)"
        type: choice
        default: alpha
        options: [alpha, beta]

# Never during an upload: both would edit the same Google Play app.
concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Version code
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::The version code is a number, as in Internal testing → Releases (e.g. 1004)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Promote to ${{ github.event.inputs.track }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          TRACK: ${{ github.event.inputs.track }}
        run: bundle exec fastlane android promote

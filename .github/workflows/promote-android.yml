name: Promote Android

# Releases a version already in internal testing (the bundle testers checked) on closed or open testing, with the
# release notes of fastlane/metadata-android: no new build, same version code. Completed (the default) sends it for
# review at once; draft leaves it to review and roll out in the Play Console. A push to main does this for closed
# testing by itself, and a vX.Y.Z tag sends a new build there (Release Android).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code in internal testing (e.g. 1004)"
        required: true
        type: string
      track:
        description: "Track to promote to (alpha = closed testing, beta = open testing)"
        type: choice
        default: alpha
        options: [alpha, beta]
      release_status:
        description: "completed: sent for review at once (managed publishing off); draft: reviewed and rolled out in the Play Console"
        type: choice
        default: completed
        options: [completed, draft]

# Never during an upload: both would edit the same Google Play app.
concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Google Play
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Version code
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::The version code is a number, as in Internal testing → Releases (e.g. 1004)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Promote to ${{ github.event.inputs.track }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          TRACK: ${{ github.event.inputs.track }}
          RELEASE_STATUS: ${{ github.event.inputs.release_status }}
        run: bundle exec fastlane android promote

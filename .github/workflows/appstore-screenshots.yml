name: App Store screenshots

# Captures the App Store screenshots (iPhone 6.9", iPad 13" and Mac, English and French) from the
# fixture catalogue and publishes them on the `appstore-screenshots` branch (Mac ones under `mac/`);
# the release workflow uploads them with the listing. Run by the release workflow before it uploads the listing (a
# version tag, targets release, all and metadata), or by hand to look at them; not on pushes: nothing reads them between
# releases (docs/CI.md). One macOS job per device builds once and captures each language from that build.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.device }}
    # A newer run by hand replaces an older one; the release workflow's call is never cancelled by one (github.workflow
    # is the caller's name in a call).
    concurrency:
      group: appstore-screenshots-${{ github.workflow }}-${{ matrix.device }}
      cancel-in-progress: ${{ github.workflow == 'App Store screenshots' }}
    runs-on: macos-26
    # The Xcode the apps are built with, not the image's default (which moves with each image). When an image no
    # longer has it, the Xcode step below says so: raise it in every macOS job (ci.yml, appstore-screenshots.yml,
    # release.yml) and in docs/RELEASE.md.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: [iphone-max, ipad-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::$DEVELOPER_DIR is not on this runner image, which has: $(ls -d /Applications/Xcode_*.app | xargs)"; exit 1; }
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Pick and prepare the simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py ${{ matrix.device }})
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4 || true
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Ondo.xcodeproj -scheme Ondo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/shots \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Capture and export, each language
        # The test reads its language from SCREENSHOT_LANG (TEST_RUNNER_ variables reach the test runner); each launch
        # starts from -uitest-reset, so one language leaves nothing to the next. Both languages are tried, and any
        # failure fails the job.
        run: |
          status=0
          for locale in en-US fr-FR; do
            case "$locale" in fr*) lang=fr ;; *) lang=en ;; esac
            set -o pipefail
            TEST_RUNNER_SCREENSHOT_LANG=$lang xcodebuild test-without-building \
              -project Ondo.xcodeproj -scheme Ondo \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -only-testing:OndoUITests/AppStoreScreenshots \
              -derivedDataPath build/shots \
              -clonedSourcePackagesDirPath build/spm \
              -resultBundlePath "build/Shots-$locale.xcresult" \
              CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions || status=1
            mkdir -p "raw-$locale" out
            xcrun xcresulttool export attachments --path "build/Shots-$locale.xcresult" --output-path "raw-$locale" || status=1
            python3 .github/scripts/collect_appstore_screenshots.py "raw-$locale" out "$locale" ${{ matrix.device }} || status=1
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-${{ matrix.device }}
          path: out

  mac:
    name: mac
    concurrency:
      group: appstore-screenshots-${{ github.workflow }}-mac
      cancel-in-progress: ${{ github.workflow == 'App Store screenshots' }}
    runs-on: macos-26
    # The Xcode the apps are built with, not the image's default (which moves with each image). When an image no
    # longer has it, the Xcode step below says so: raise it in every macOS job (ci.yml, appstore-screenshots.yml,
    # release.yml) and in docs/RELEASE.md.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::$DEVELOPER_DIR is not on this runner image, which has: $(ls -d /Applications/Xcode_*.app | xargs)"; exit 1; }
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build for testing (macOS UI test, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Ondo.xcodeproj -scheme OndoMacScreenshots \
            -destination "platform=macOS" \
            -derivedDataPath build/macos \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify --renderer github-actions
      - name: Capture and export, each language
        run: |
          status=0
          for locale in en-US fr-FR; do
            case "$locale" in fr*) lang=fr ;; *) lang=en ;; esac
            set -o pipefail
            TEST_RUNNER_SCREENSHOT_LANG=$lang xcodebuild test-without-building \
              -project Ondo.xcodeproj -scheme OndoMacScreenshots \
              -destination "platform=macOS" \
              -derivedDataPath build/macos \
              -clonedSourcePackagesDirPath build/spm \
              -resultBundlePath "build/MacShots-$locale.xcresult" \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify --renderer github-actions || status=1
            mkdir -p "raw-$locale" out
            xcrun xcresulttool export attachments --path "build/MacShots-$locale.xcresult" --output-path "raw-$locale" || status=1
            python3 .github/scripts/collect_appstore_screenshots.py "raw-$locale" out/mac "$locale" mac || status=1
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-mac
          path: out

  publish:
    name: Publish to the appstore-screenshots branch
    needs: [capture, mac]
    # The iPhone / iPad captures are published even if the Mac ones failed; the Mac ones already on the branch are
    # then kept. Nothing is published when an iPhone / iPad capture failed: the release uploads the branch as it was.
    if: ${{ !cancelled() && needs.capture.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shots
          pattern: shots-*
          merge-multiple: true
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          MAC: ${{ needs.mac.result }}
        run: |
          mkdir -p shots
          cd shots
          git init -q
          git checkout -q -b appstore-screenshots
          if [ "$MAC" != success ]; then
            rm -rf mac
            if git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" appstore-screenshots \
                && git cat-file -e FETCH_HEAD:mac 2>/dev/null; then
              git archive FETCH_HEAD mac | tar -x
              echo "::warning::The Mac captures failed: the Mac screenshots already on the branch are kept."
            fi
          fi
          find . -path ./.git -prune -o -type f -print | sort
          echo "App Store screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "App Store screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" appstore-screenshots

name: App Store screenshots

# Captures the App Store screenshots (iPhone 6.9", iPad 13" and Mac, English and French) from the
# fixture catalogue and publishes them on the `appstore-screenshots` branch (Mac ones under `mac/`);
# the release workflow uploads them with the listing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - UITests/AppStoreScreenshots.swift
      - App/Model/UITestFixture.swift
      - App/Features/Home/**
      - .github/workflows/appstore-screenshots.yml
      - .github/scripts/collect_appstore_screenshots.py
      - MacUITests/**

concurrency:
  group: appstore-screenshots
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: ${{ matrix.device }} · ${{ matrix.locale }}
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: [iphone-max, ipad-13]
        locale: [en-US, fr-FR]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - name: Pick and prepare the simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py ${{ matrix.device }})
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4 || true
      - name: Capture
        env:
          TEST_RUNNER_SCREENSHOT_LANG: ${{ startsWith(matrix.locale, 'fr') && 'fr' || 'en' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ondo.xcodeproj -scheme Ondo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:OndoUITests/AppStoreScreenshots \
            -derivedDataPath build/shots \
            -clonedSourcePackagesDirPath build/spm \
            -resultBundlePath build/Shots.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Export
        if: always()
        run: |
          mkdir -p raw out
          xcrun xcresulttool export attachments --path build/Shots.xcresult --output-path raw
          python3 .github/scripts/collect_appstore_screenshots.py raw out ${{ matrix.locale }} ${{ matrix.device }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-${{ matrix.device }}-${{ matrix.locale }}
          path: out

  mac:
    name: mac · ${{ matrix.locale }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, fr-FR]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - name: Capture (macOS UI test, ad-hoc signed)
        env:
          TEST_RUNNER_SCREENSHOT_LANG: ${{ startsWith(matrix.locale, 'fr') && 'fr' || 'en' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ondo.xcodeproj -scheme OndoMacScreenshots \
            -destination "platform=macOS" \
            -derivedDataPath build/macos \
            -clonedSourcePackagesDirPath build/spm \
            -resultBundlePath build/MacShots.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify --renderer github-actions
      - name: Export
        if: always()
        run: |
          mkdir -p raw out
          xcrun xcresulttool export attachments --path build/MacShots.xcresult --output-path raw
          python3 .github/scripts/collect_appstore_screenshots.py raw out/mac ${{ matrix.locale }} mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-mac-${{ matrix.locale }}
          path: out

  publish:
    name: Publish to the appstore-screenshots branch
    needs: [capture, mac]
    # The iPhone / iPad captures are published even if the Mac ones failed.
    if: ${{ !cancelled() && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shots
          pattern: shots-*
          merge-multiple: true
      - name: Push
        run: |
          cd shots
          find . -type f | sort
          echo "App Store screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git init -q
          git checkout -q -b appstore-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "App Store screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" appstore-screenshots

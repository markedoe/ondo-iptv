name: App Store screenshots

# Captures the App Store screenshots (iPhone 6.9", iPad 13" and Mac, English and French) from the
# fixture catalogue and publishes them on the `appstore-screenshots` branch (Mac ones under `mac/`);
# the release workflow uploads them with the listing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - UITests/AppStoreScreenshots.swift
      - App/Model/UITestFixture.swift
      - App/Features/Home/**
      - .github/workflows/appstore-screenshots.yml
      - .github/scripts/collect_appstore_screenshots.py
      - .github/scripts/capture_mac_screenshots.py

concurrency:
  group: appstore-screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: ${{ matrix.device }} · ${{ matrix.locale }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        device: [iphone-max, ipad-13]
        locale: [en-US, fr-FR]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - name: Pick and prepare the simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py ${{ matrix.device }})
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4 || true
      - name: Capture
        env:
          TEST_RUNNER_SCREENSHOT_LANG: ${{ startsWith(matrix.locale, 'fr') && 'fr' || 'en' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ondo.xcodeproj -scheme Ondo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:OndoUITests/AppStoreScreenshots \
            -derivedDataPath build/shots \
            -clonedSourcePackagesDirPath build/spm \
            -resultBundlePath build/Shots.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Export
        if: always()
        run: |
          mkdir -p raw out
          xcrun xcresulttool export attachments --path build/Shots.xcresult --output-path raw
          python3 .github/scripts/collect_appstore_screenshots.py raw out ${{ matrix.locale }} ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.device }}-${{ matrix.locale }}
          path: out

  mac:
    name: mac · ${{ matrix.locale }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, fr-FR]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - name: Build (Debug, demo catalogue)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ondo.xcodeproj -scheme Ondo \
            -destination "platform=macOS" \
            -configuration Debug \
            -derivedDataPath build/macos \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
          codesign --force --deep --sign - --entitlements App/Resources/Ondo-macOS-Debug.entitlements \
            build/macos/Build/Products/Debug/Ondo.app
      - name: Capture
        run: python3 .github/scripts/capture_mac_screenshots.py build/macos/Build/Products/Debug/Ondo.app out ${{ matrix.locale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-mac-${{ matrix.locale }}
          path: out

  publish:
    name: Publish to the appstore-screenshots branch
    needs: [capture, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: shots
          pattern: shots-*
          merge-multiple: true
      - name: Push
        run: |
          cd shots
          find . -type f | sort
          echo "App Store screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git init -q
          git checkout -q -b appstore-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "App Store screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" appstore-screenshots

name: Awards data

# Refreshes the awards and festival selections from Wikidata (CC0) once a month and publishes awards.json on the
# `awards-data` branch, which the apps download once a week unless the viewer turns it off in Settings. The copies
# bundled with the apps (App/Resources, android assets) are refreshed by hand with the same script.
on:
  schedule:
    - cron: "17 4 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awards-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and publish
    runs-on: ubuntu-latest
    # Wikidata may answer one query a minute: the script waits and retries.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Query Wikidata
        # The script fails if a known winner is missing (the award items are the ones it expects).
        run: python3 -I tools/awards/generate_awards.py --pause 10 --output build/awards-data/awards.json
      - name: Compare with the published file
        # A sharp drop means Wikidata answered partly: the published file stays.
        run: |
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/awards-data/awards.json" -o published.json \
            || cp App/Resources/awards.json published.json
          python3 -I - published.json build/awards-data/awards.json <<'EOF'
          import json, sys
          old, new = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:3])
          before, after = len(old["films"]), len(new["films"])
          print(f"{before} films published, {after} now, generated {new['generated']}")
          if after < before * 0.9:
              sys.exit(f"::error::{after} films instead of {before}: not published")
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/awards-data
          echo "awards.json made by the Awards data workflow (run ${GITHUB_RUN_ID}) from Wikidata (CC0 1.0)." > README.md
          git init -q
          git checkout -q -b awards-data
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "Awards data of $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" awards-data

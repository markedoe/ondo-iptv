name: App Store header and search results

# The product page header and the search results asset of the iOS and iPadOS app (iOS 27 and later), in App Store
# Connect's Asset Library: fastlane/creative/<locale>/header.png and search.jpg, drawn by fastlane/creative/render.mjs.
#   status  what App Store Connect holds (read only)
#   upload  the files into the Asset Library, unreviewed, without touching any version
#   place   onto the iOS version being prepared; refused for a version in review or approved
#   submit  for review on their own, once an iOS version is approved; refused while one is in review. Run it only
#           with the user's go (CLAUDE.md)
#   publish the approved assets onto the live iOS version, without a new version
#   iap     where the tips' In-App Purchases stand, and every App Store version's state (read only: GET requests only)
#   iap_create  creates or completes the three tips (fastlane/tips.json): names and descriptions in every listing
#           language, price in euros (France as base territory), every territory, review screenshot when
#           fastlane/creative/iap-review.png exists. Idempotent, deletes nothing, submits nothing: a version tag
#           submits them with the app version once the App Store edition sells them
#   iap_screenshot_show  copies the review screenshot of the tips captured by App Store screenshots run
#           `screenshot_run` to the iap-review-shot branch, to look at it (touches nothing on App Store Connect)
#   iap_screenshot  uploads that screenshot (en-US) as the review screenshot of each tip that has none
# See docs/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: status
        options: [status, upload, place, submit, publish, iap, iap_create, iap_screenshot_show, iap_screenshot]
      screenshot_run:
        description: App Store screenshots run whose iap-review-screenshot artifact to use (iap_screenshot_show, iap_screenshot)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: app-store-assets
  cancel-in-progress: false

jobs:
  show:
    name: Tips' review screenshot to the iap-review-shot branch
    if: github.event.inputs.action == 'iap_screenshot_show'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A job of its own: the write token never meets the App Store Connect key.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iap-review-screenshot
          path: shot
          run-id: ${{ github.event.inputs.screenshot_run }}
          github-token: ${{ github.token }}
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.inputs.screenshot_run }}
        run: |
          cd shot
          echo "Review screenshot of the tips from App Store screenshots run ${RUN}" > README.md
          git init -q
          git checkout -q -b iap-review-shot
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "Tips review screenshot from run ${RUN}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" iap-review-shot

  assets:
    name: Asset Library
    if: github.event.inputs.action != 'iap_screenshot_show'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tips' review screenshot
        if: github.event.inputs.action == 'iap_screenshot'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iap-review-screenshot
          path: ${{ runner.temp }}/iap-review
          run-id: ${{ github.event.inputs.screenshot_run }}
          github-token: ${{ github.token }}
      - name: ${{ github.event.inputs.action }}
        # The API key (the release workflow's) only for this step; the script prints no secret and no contact detail.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ACTION: ${{ github.event.inputs.action }}
          SHOT: ${{ runner.temp }}/iap-review/en-US/iap-review-tips-iphone-max.png
        run: |
          if [ "$ACTION" = iap_screenshot ]; then
            python3 -I .github/scripts/asset_library.py iap_screenshot "$SHOT"
          else
            python3 -I .github/scripts/asset_library.py "$ACTION"
          fi

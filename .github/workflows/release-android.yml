name: Release Android

# Tests, builds the signed release bundle and sends it to Google Play. A version tag (v1.2.0: the user's go, CLAUDE.md)
# sends it with the listing to closed testing, for review at once (managed publishing off); a push to main sends the
# build alone to internal testing (deliver.yml); a run by hand goes to the chosen track. Every build that reaches internal
# testing then goes to closed testing too, with its release notes, sent for review (CLAUDE.md); while Google reviews
# closed testing, Play catch-up (play-catchup.yml) sends it there once the review is over.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (alpha = closed testing, beta = open testing)"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status: completed is sent for review at once on a test track (managed publishing off); production is always a draft"
        type: choice
        default: completed
        options: [completed, draft]
      listing:
        description: "upload: the build with the listing texts and screenshots; skip: the build alone (the listing in review stays as it is)"
        type: choice
        default: upload
        options: [upload, skip]

# One release at a time, whatever the tag: two uploads at once would race on the same Google Play app.
concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: Google Play
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Each secret is given only to the step that uses it, not to the tools installed before (gems, Gradle
    # plugins download their own code).
    env:
      # A tag: closed testing. Production waits for the closed test Google asks of new accounts (docs/RELEASE-ANDROID.md).
      TRACK: ${{ github.event.inputs.track || 'alpha' }}
      RELEASE_STATUS: ${{ github.event.inputs.status || 'completed' }}
      LISTING: ${{ github.event.inputs.listing || 'upload' }}
      # Internal testing is not reviewed: its uploads must not cancel and restart a review in progress (Fastfile).
      KEEP_PLAY_REVIEW: ${{ (github.event.inputs.track || 'alpha') == 'internal' }}
    steps:
      - name: Production comes from a version tag
        # From a branch, or another tag, the bundle would keep the default versionName of
        # android/app/build.gradle.kts.
        if: env.TRACK == 'production'
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::The production track is published from a vX.Y.Z tag: choose it in Use workflow from → Tags (this run is on the $GITHUB_REF_TYPE $GITHUB_REF_NAME)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the version of the apps
        # The builds between releases take their version from build.gradle.kts and project.yml: the tag must agree.
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          android=$(sed -n 's/.*ANDROID_VERSION_NAME") ?: "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          apple=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1)
          echo "tag $tag, Android $android, project.yml $apple"
          if [ "$tag" != "$android" ] || [ "$tag" != "$apple" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match versionName in android/app/build.gradle.kts ($android) and MARKETING_VERSION in project.yml ($apple)."
            exit 1
          fi
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See docs/RELEASE-ANDROID.md."
              exit 1
            fi
          done
      - name: Review playlist answers
        # Internal testing has no review.
        if: env.TRACK != 'internal'
        # App Review and the Google Play reviewer test the apps with the playlist the review notes give, hosted on
        # main's site (site/review): if it or any of its streams stopped answering, the review would fail for a
        # reason no test sees.
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          python3 .github/scripts/check_review_playlist.py --online "https://$OWNER.github.io/ondo-iptv/review/ondo-review.m3u"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Tests and listing screenshots
        # No secret here: the tests run third-party code (test libraries, Robolectric).
        # A build alone for internal testing (deliver.yml, after the Android workflow passed on this commit) needs
        # neither the tests again nor the listing's screenshots.
        if: env.TRACK != 'internal' || env.LISTING != 'skip'
        working-directory: android
        run: |
          ./gradlew -p core test --stacktrace
          # Unit, Compose and screenshot tests; the screenshots become the store listing images.
          ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          # Version code: always increasing (Play refuses reuse); version name from the tag.
          export ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then case "$GITHUB_REF_NAME" in v*) export ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}";; esac; fi
          status=0
          ./gradlew :app:bundleRelease --stacktrace || status=$?
          rm -f "$RUNNER_TEMP/upload.jks"
          [ "$status" -eq 0 ] || exit "$status"
          # Without the upload key, Gradle would quietly sign with the debug key, which Play refuses.
          certificate=$(keytool -printcert -jarfile app/build/outputs/bundle/release/*.aab 2>&1 || true)
          echo "$certificate" | grep -q "Owner:" || { echo "::error::The bundle is not signed"; exit 1; }
          if echo "$certificate" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key"; exit 1
          fi
      - name: Listing screenshots
        if: env.TRACK != 'internal' || env.LISTING != 'skip'
        run: |
          for dir in android/app/src/test/screenshots/play/*/*/; do
            locale=$(basename "$(dirname "$dir")")
            kind=$(basename "$dir")
            mkdir -p "fastlane/metadata-android/$locale/images/$kind"
            cp "$dir"*.png "fastlane/metadata-android/$locale/images/$kind/"
          done
          find fastlane/metadata-android -name "*.png" | sort
      - name: Release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ondo-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Google Play
        id: upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android deploy
      - name: Closed testing
        # The same version code, from internal testing to closed testing, completed (sent for review) with the release
        # notes, in a second edit; only when Google Play took the internal build. It commits with ERROR_IF_IN_REVIEW
        # (KEEP_PLAY_REVIEW): while Google reviews something, Play refuses it and the step ends with a notice, and Play
        # catch-up sends the newest build once the review is over. Any other refusal (a language the listing lacks)
        # turns this step red with an error, while the internal build stays delivered.
        if: env.TRACK == 'internal' && steps.upload.outputs.delivered == 'true'
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # The Google Play reviewer tests with the review playlist (Review playlist answers, skipped for internal).
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          if ! python3 .github/scripts/check_review_playlist.py --online "https://$OWNER.github.io/ondo-iptv/review/ondo-review.m3u"; then
            echo "::error::The review playlist does not answer: version code $VERSION_CODE stays in internal testing only, not sent to closed testing."
            exit 1
          fi
          if TRACK=alpha RELEASE_STATUS=completed bundle exec fastlane android promote 2>&1 | tee "$RUNNER_TEMP/promote.log"; then
            echo "Closed testing: version code $VERSION_CODE released (completed, sent for review)." >> "$GITHUB_STEP_SUMMARY"
          else
            # A notice when changes are in review, else an error and a red step.
            python3 -I .github/scripts/play_catchup.py outcome "$RUNNER_TEMP/promote.log"
          fi

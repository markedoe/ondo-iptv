name: Release Android

# Tests, builds the signed release bundle and sends it to Google Play with the listing: internal testing for
# an android-v* tag, the chosen track when run by hand.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (alpha = closed testing, beta = open testing)"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status, internal track only (draft while the app has never been published; other tracks are always drafts)"
        type: choice
        default: completed
        options: [completed, draft]

# One release at a time, whatever the tag: two uploads at once would race on the same Google Play app.
concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Each secret is given only to the step that uses it, not to the tools installed before (gems, Gradle
    # plugins download their own code).
    env:
      TRACK: ${{ github.event.inputs.track || 'internal' }}
      RELEASE_STATUS: ${{ github.event.inputs.status || 'completed' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See docs/RELEASE-ANDROID.md."
              exit 1
            fi
          done
      - name: Demo playlist answers
        # The Google Play reviewer taps "Try the demo": if the public list moved or broke, the review fails
        # for a reason no test sees. The address is read from the app's code.
        run: |
          URL=$(grep -o 'https://[^"]*\.m3u' android/app/src/main/kotlin/com/markedoe/ondo/ui/OndoViewModel.kt | head -1)
          curl -fsSL --retry 2 --max-time 60 "$URL" -o demo.m3u
          head -c 7 demo.m3u | grep -q '#EXTM3U' || { echo "::error::$URL is not an M3U playlist"; exit 1; }
          echo "$(grep -c '^#EXTINF' demo.m3u) entries in $URL"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Tests and listing screenshots
        # No secret here: the tests run third-party code (test libraries, Robolectric).
        working-directory: android
        run: |
          ./gradlew -p core test --stacktrace
          # Unit, Compose and screenshot tests; the screenshots become the store listing images.
          ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          # Version code: always increasing (Play refuses reuse); version name from the tag.
          export ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          # The test tracks get the beta badge; a production build never has it.
          if [ "$TRACK" = production ]; then export ANDROID_BETA=false; else export ANDROID_BETA=true; fi
          case "$GITHUB_REF_NAME" in android-v*) export ANDROID_VERSION_NAME="${GITHUB_REF_NAME#android-v}";; esac
          status=0
          ./gradlew :app:bundleRelease --stacktrace || status=$?
          rm -f "$RUNNER_TEMP/upload.jks"
          [ "$status" -eq 0 ] || exit "$status"
          # Without the upload key, Gradle would quietly sign with the debug key, which Play refuses.
          certificate=$(keytool -printcert -jarfile app/build/outputs/bundle/release/*.aab 2>&1 || true)
          echo "$certificate" | grep -q "Owner:" || { echo "::error::The bundle is not signed"; exit 1; }
          if echo "$certificate" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key"; exit 1
          fi
      - name: Listing screenshots
        run: |
          for dir in android/app/src/test/screenshots/play/*/*/; do
            locale=$(basename "$(dirname "$dir")")
            kind=$(basename "$dir")
            mkdir -p "fastlane/metadata-android/$locale/images/$kind"
            cp "$dir"*.png "fastlane/metadata-android/$locale/images/$kind/"
          done
          find fastlane/metadata-android -name "*.png" | sort
      - name: Release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ondo-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android deploy

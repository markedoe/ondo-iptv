name: Mutation testing

# Weekly: Pitest plants small bugs in the Kotlin core (inverted conditions, removed calls, changed
# boundaries) and reports those no test catches. The score is read in the summary and the report kept as
# an artifact; it does not fail the build.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pitest:
    name: Kotlin core (Pitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Pitest
        run: ./gradlew -p core pitest --stacktrace
      - name: Score
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, xml.etree.ElementTree as ET
          mutants = list(ET.parse("core/build/reports/pitest/mutations.xml").getroot())
          detected = sum(m.get("detected") == "true" for m in mutants)
          print(f"### Kotlin core: {detected}/{len(mutants)} mutants detected ({100 * detected / max(len(mutants), 1):.0f} %)")
          survivors = collections.Counter(m.findtext("mutatedClass").split("$")[0] for m in mutants if m.get("detected") != "true")
          print("\n| Class | Undetected mutants |\n|---|---|")
          for name, count in survivors.most_common(10):
              print(f"| `{name}` | {count} |")
          PY
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-report
          path: android/core/build/reports/pitest
          if-no-files-found: ignore

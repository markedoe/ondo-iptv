name: Release

# A version tag (v1.2.0: the user's go, CLAUDE.md) releases iOS and macOS: App Store edition builds, the listing, and
# the submission for App Review, a submission of the same version still waiting being withdrawn first; then the
# TestFlight edition is built again. A push to main reaches TestFlight only (deliver.yml, target builds, external): the
# TestFlight edition for internal testers and the App Store edition for external testers, through Beta App Review.
# Nothing is submitted for App Review unless CI's long jobs (macOS) passed on the commit: the night's run or a run by
# hand (job "Long tests passed on this commit").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deliver (builds: iOS and macOS without the listing, what a push to main sends to TestFlight)"
        type: choice
        default: all
        options: [all, builds, ios, mac, metadata, metadata-ios, metadata-mac, release, submit, status, withdraw-ios, withdraw-mac]
      edition:
        description: "testflight: with downloads, for testers only; app-store: without downloads, the build to submit"
        type: choice
        default: testflight
        options: [testflight, app-store]
      ios_build:
        description: "submit: the iOS build number of the App Store edition, from its release run's log (empty: iOS is not submitted)"
        type: string
        default: ""
      mac_build:
        description: "submit: the macOS build number of the App Store edition, from its release run's log (empty: macOS is not submitted)"
        type: string
        default: ""
      submit:
        description: "release by hand: also submit for App Review (off: a rehearsal that builds, uploads the listing and stops there)"
        type: boolean
        default: false
      external:
        description: "builds, testflight edition: first the App Store edition for external testers, through Beta App Review (what a push to main does)"
        type: boolean
        default: false

# One release at a time, whatever the tag or branch: two runs would both take the latest build number + 1 and
# collide on App Store Connect. A running upload is never cancelled; GitHub keeps one run waiting, the newest.
concurrency:
  group: release-apple
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Long tests passed on this commit
    # A submission for App Review (a tag, target release with submit, target submit) waits for no build: CI's macOS jobs
    # must have passed on this very commit, at night or by hand (docs/CI.md); otherwise nothing runs, not even the
    # screenshots. The other targets go on.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || github.event.inputs.target == 'submit' || (github.event.inputs.target == 'release' && github.event.inputs.submit == 'true')
        with:
          persist-credentials: false
      - name: CI's macOS jobs passed on this commit
        if: github.event_name == 'push' || github.event.inputs.target == 'submit' || (github.event.inputs.target == 'release' && github.event.inputs.submit == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        # Any doubt refuses (ci_scope.py production): runs that cannot be read, another commit, a run whose macOS jobs
        # were skipped.
        run: |
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          python3 -I .github/scripts/ci_scope.py production ci "$sha"

  screenshots:
    name: App Store screenshots
    # Fresh captures for the runs that upload the listing (a tag, targets release, all and metadata*); the deliver job
    # waits for them. contents: write lets the called workflow's publish job update the appstore-screenshots branch;
    # no secret is passed to it.
    # After the gate: a refused submission captures nothing.
    needs: gate
    if: github.event_name == 'push' || github.event.inputs.target == 'release' || github.event.inputs.target == 'all' || startsWith(github.event.inputs.target, 'metadata')
    permissions:
      contents: write
    uses: ./.github/workflows/appstore-screenshots.yml

  deliver:
    name: TestFlight / App Store Connect
    # After the screenshots (skipped for the other targets). Their failure stops a tag and targets release and all
    # before anything is built (step App Store screenshots captured); the metadata targets then take the screenshots
    # the appstore-screenshots branch already holds. Never after a refused gate.
    needs: [gate, screenshots]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: macos-26
    # A release waits for App Store Connect's processing of both builds.
    timeout-minutes: 240
    # The App Store edition builds for external testers, handed by the job external below to testflight-external.yml
    # (on Linux, outside this release queue). Empty when not built.
    outputs:
      ios_app_store_build: ${{ steps.ios_app_store.outputs.build }}
      mac_app_store_build: ${{ steps.mac_app_store.outputs.build }}
    # actions: read: the step "CI passed on this commit" reads this repository's CI runs.
    permissions:
      actions: read
      contents: read
    # The signing secrets are given only to the steps that sign or upload, not to the tools installed or run
    # before them (gems, Homebrew, XcodeGen, which generates the project in a step of its own).
    env:
      # The Xcode the apps are built with, not the image's default (which moves with each image). When an image no
      # longer has it, the Xcode step below says so: raise it in every macOS job (ci.yml, appstore-screenshots.yml,
      # release.yml) and in docs/RELEASE.md.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # gym's -clonedSourcePackagesDirPath, for its package resolution and its archive: the Swift packages CI checked
      # out (step Swift packages).
      GYM_CLONED_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/build/spm
      TARGET: ${{ github.event.inputs.target || 'release' }}
      # A tag (and a release by hand) builds the App Store edition: the one that can be submitted.
      EDITION: ${{ github.event.inputs.target == 'release' && 'app-store' || github.event.inputs.edition || 'app-store' }}
      # A tag submits; a release run by hand submits only when asked.
      SUBMIT: ${{ github.event_name == 'push' || github.event.inputs.submit == 'true' }}
      # A push to main (deliver.yml): the App Store edition for external testers too, built before the TestFlight edition
      # so that the internal testers' latest build stays the TestFlight edition one.
      EXTERNAL: ${{ github.ref == 'refs/heads/main' && github.event.inputs.external == 'true' && github.event.inputs.target == 'builds' && github.event.inputs.edition == 'testflight' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App Store screenshots captured
        # The listing must match the build (CLAUDE.md): a run that uploads the listing with a build (a tag, targets
        # release and all) never falls back to older screenshots. Only the metadata targets, which submit nothing, may.
        if: env.TARGET == 'release' || env.TARGET == 'all'
        env:
          CAPTURE: ${{ needs.screenshots.result }}
        run: |
          if [ "$CAPTURE" != success ]; then
            echo "::error::The App Store screenshots were not captured ($CAPTURE): nothing is built, uploaded or submitted. Re-run the App Store screenshots, then this release (Re-run all jobs)."
            exit 1
          fi
      - name: Xcode
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::$DEVELOPER_DIR is not on this runner image, which has: $(ls -d /Applications/Xcode_*.app | xargs)"; exit 1; }
          xcodebuild -version
      - name: The tag is the version of the apps
        # project.yml and Android give the version to the builds made between releases: a tag that disagrees would ship
        # a version the next TestFlight uploads do not follow.
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          apple=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1)
          android=$(sed -n 's/.*ANDROID_VERSION_NAME") ?: "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          echo "tag $tag, project.yml $apple, Android $android"
          if [ "$tag" != "$apple" ] || [ "$tag" != "$android" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match MARKETING_VERSION in project.yml ($apple) and versionName in android/app/build.gradle.kts ($android)."
            exit 1
          fi
      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See docs/RELEASE.md."
              exit 1
            fi
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: CI passed on this commit
        id: ci
        # A TestFlight edition build of a commit whose CI long jobs passed (a night's run or one by hand): CI already ran
        # the core tests on it, on Linux and macOS. A push to main (deliver.yml) usually comes before the night, so its
        # build runs them here. The App Store edition, the one submitted for review, always runs them here.
        if: env.TARGET != 'status' && !startsWith(env.TARGET, 'withdraw') && env.EDITION == 'testflight'
        env:
          GH_TOKEN: ${{ github.token }}
        # A run of CI counts only when its macOS jobs ran and passed (on this commit or the same tree): a run that skipped
        # them (docs/CI.md) does not.
        run: |
          if python3 -I .github/scripts/ci_scope.py passed ci "$GITHUB_SHA"; then
            echo "CI passed on $GITHUB_SHA: the core tests are not run again."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful CI run on $GITHUB_SHA: the core tests run here."
          fi
      - name: Core tests
        if: env.TARGET != 'status' && !startsWith(env.TARGET, 'withdraw') && steps.ci.outputs.passed != 'true'
        working-directory: Packages/IPTVCore
        run: swift test --parallel
      - name: Review playlist answers
        # The App Store edition is the one App Review sees (the TestFlight edition goes to internal testers only).
        if: env.EDITION == 'app-store' && env.TARGET != 'status' && !startsWith(env.TARGET, 'withdraw')
        # App Review and the Google Play reviewer test the apps with the playlist the review notes give, hosted on
        # main's site (site/review): if it or any of its streams stopped answering, the review would fail for a
        # reason no test sees.
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          python3 .github/scripts/check_review_playlist.py --online "https://$OWNER.github.io/ondo-iptv/review/ondo-review.m3u"
      - name: App Store edition checks
        # The build to submit: nothing dormant, no private API, a listing and review notes App Review accepts
        # (.github/scripts/check_app_store.py), and the listing's addresses answer.
        if: env.EDITION == 'app-store' || startsWith(env.TARGET, 'metadata') || env.TARGET == 'all' || env.TARGET == 'submit' || env.TARGET == 'release'
        run: |
          python3 .github/scripts/check_app_store.py
          for file in fastlane/metadata/*/*_url.txt; do
            url=$(tr -d '[:space:]' < "$file")
            curl -fsSL --retry 2 --max-time 30 -o /dev/null "$url" || { echo "::error::$file: $url does not answer"; exit 1; }
          done
      - name: Privacy manifest and Mac sandbox checks
        # Every upload, TestFlight edition included: App Store Connect refuses a build that uses a required reason
        # API its privacy manifest does not declare, and the Mac app needs exactly its sandbox entitlements.
        if: env.TARGET == 'all' || env.TARGET == 'builds' || env.TARGET == 'ios' || env.TARGET == 'mac' || env.TARGET == 'submit' || env.TARGET == 'release'
        run: |
          python3 .github/scripts/check_privacy_manifest.py
          python3 .github/scripts/check_mac_entitlements.py
      - name: Generate Xcode project
        # Here, without secrets, rather than in the fastlane lanes that sign and upload.
        if: env.TARGET == 'all' || env.TARGET == 'builds' || env.TARGET == 'ios' || env.TARGET == 'mac' || env.TARGET == 'release'
        run: |
          brew install xcodegen || true
          xcodegen generate
      - name: Swift packages
        # The checkouts CI keeps for the same project.yml (the versions are pinned there), restored but never saved
        # from this job, which holds the signing secrets. Without them, gym fetches the packages itself.
        if: env.TARGET == 'all' || env.TARGET == 'builds' || env.TARGET == 'ios' || env.TARGET == 'mac' || env.TARGET == 'release'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      # External testers (CLAUDE.md, App Store): the App Store edition, the build App Review would get, is checked as
      # for a release, built and uploaded without waiting; the job external sends it through Beta App Review. A failure
      # here never stops the TestFlight edition (continue-on-error), and step External testers builds turns the run red.
      - name: App Store edition checks (external testers)
        id: external_checks
        if: env.EXTERNAL == 'true'
        continue-on-error: true
        run: |
          python3 .github/scripts/check_app_store.py
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          python3 .github/scripts/check_review_playlist.py --online "https://$OWNER.github.io/ondo-iptv/review/ondo-review.m3u"
          for file in fastlane/metadata/*/*_url.txt; do
            url=$(tr -d '[:space:]' < "$file")
            curl -fsSL --retry 2 --max-time 30 -o /dev/null "$url" || { echo "::error::$file: $url does not answer"; exit 1; }
          done
      - name: iOS App Store edition → TestFlight (external testers)
        id: ios_app_store
        if: env.EXTERNAL == 'true' && steps.external_checks.outcome == 'success'
        continue-on-error: true
        env:
          EDITION: app-store
          WAIT_FOR_PROCESSING: false
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane ios beta
      - name: iOS → TestFlight
        id: ios
        if: env.TARGET == 'all' || env.TARGET == 'builds' || env.TARGET == 'ios' || env.TARGET == 'release'
        env:
          WAIT_FOR_PROCESSING: ${{ env.TARGET == 'release' }}
          AFTER_BUILD_NUMBER: ${{ steps.ios_app_store.outputs.build }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane ios beta
      - name: macOS App Store edition → TestFlight (external testers)
        id: mac_app_store
        if: env.EXTERNAL == 'true' && steps.external_checks.outcome == 'success'
        continue-on-error: true
        env:
          EDITION: app-store
          WAIT_FOR_PROCESSING: false
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane mac beta
      - name: macOS → TestFlight
        id: mac
        if: env.TARGET == 'all' || env.TARGET == 'builds' || env.TARGET == 'mac' || env.TARGET == 'release'
        env:
          WAIT_FOR_PROCESSING: ${{ env.TARGET == 'release' }}
          AFTER_BUILD_NUMBER: ${{ steps.mac_app_store.outputs.build }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane mac beta
      - name: App Store screenshots
        if: env.TARGET == 'all' || startsWith(env.TARGET, 'metadata') || env.TARGET == 'status' || env.TARGET == 'release'
        env:
          CAPTURE: ${{ needs.screenshots.result }}
        run: |
          # Published by the "App Store screenshots" workflow (job screenshots above); the listing is uploaded without
          # them otherwise. A failed capture stops targets release and all at the start (step App Store screenshots
          # captured); the metadata targets, which submit nothing, then take the screenshots already on the branch.
          if [ "$CAPTURE" = failure ]; then
            echo "::warning::The App Store screenshots capture failed: the listing takes the screenshots already on the appstore-screenshots branch."
          fi
          if git fetch -q origin appstore-screenshots; then
            mkdir -p shots fastlane/screenshots/ios fastlane/screenshots/mac
            # FETCH_HEAD: the checkout only maps main, so origin/appstore-screenshots may not exist.
            git archive FETCH_HEAD | tar -x -C shots
            if [ -d shots/mac ]; then mv shots/mac/* fastlane/screenshots/mac/ && rm -rf shots/mac; fi
            find fastlane/screenshots/mac -type f ! -name '*-mac.png' -delete
            rm -f shots/README.md
            mv shots/* fastlane/screenshots/ios/ 2>/dev/null || true
            # Screens taken when a capture test failed are diagnostics, not listing images.
            find fastlane/screenshots -type d -name failures -prune -exec rm -rf {} +
            find fastlane/screenshots -type f | sort
          fi
      - name: App Store listing
        if: env.TARGET == 'all' || startsWith(env.TARGET, 'metadata')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # A version in review cannot be edited: metadata-ios and metadata-mac update one platform only.
          if [ "$TARGET" != metadata-mac ]; then bundle exec fastlane ios metadata; fi
          if [ "$TARGET" != metadata-ios ]; then bundle exec fastlane mac metadata; fi
      # The tips' review screenshot (Settings → Leave a tip), captured by this run's screenshots job as its own
      # artifact, kept outside the checkout so it never joins the listing's screenshots. Uploaded to each tip that has
      # none, before the submission: a tip without it is not READY_TO_SUBMIT and would stay out of it.
      - name: Tips' review screenshot (download)
        id: iap_screenshot
        if: env.TARGET == 'release'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iap-review-screenshot
          path: ${{ runner.temp }}/iap-review
      - name: Tips' review screenshot
        if: env.TARGET == 'release' && env.SUBMIT == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SHOT: ${{ runner.temp }}/iap-review/en-US/iap-review-tips-iphone-max.png
        run: |
          if [ -f "$SHOT" ]; then
            python3 -I .github/scripts/asset_library.py iap_screenshot "$SHOT"
          else
            echo "::warning::No iap-review-screenshot artifact in this run: the tips' review screenshot is not uploaded."
          fi
      # A version tag: the listing, the build this run uploaded and the submission, one platform after the other (the
      # Mac also after a failed iOS release: the two versions are independent).
      - name: iOS → App Review
        id: release_ios
        if: env.TARGET == 'release'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ steps.ios.outputs.build }}
        run: bundle exec fastlane ios release
      - name: macOS → App Review
        if: "!cancelled() && (success() || steps.release_ios.outcome == 'failure') && env.TARGET == 'release'"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ steps.mac.outputs.build }}
        run: bundle exec fastlane mac release
      # Submission for App Review, only when the user asks for it (CLAUDE.md, App Store): the listing as it is on App
      # Store Connect (target metadata first) and the App Store edition build given by number, never the latest build,
      # which may be a TestFlight edition one. Released as soon as Apple approves it.
      - name: Submit iOS for review
        id: submit_ios
        if: env.TARGET == 'submit' && github.event.inputs.ios_build != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.event.inputs.ios_build }}
        run: bundle exec fastlane ios submit
      - name: Submit macOS for review
        # Also after a failed iOS submission (the two versions are independent), never after a failed check: the
        # status functions here replace GitHub's implicit success().
        if: "!cancelled() && (success() || steps.submit_ios.outcome == 'failure') && env.TARGET == 'submit' && github.event.inputs.mac_build != ''"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.event.inputs.mac_build }}
        run: bundle exec fastlane mac submit
      - name: App Store Connect status (read only)
        # The versions of this release as App Store Connect holds them: state, selected build, review notes, and the
        # screenshots compared with today's. Prints no contact detail.
        if: env.TARGET == 'status'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane status
      - name: Withdraw from App Review
        # The user's decision, run by hand: removes this platform's submission (waiting, in review or with unresolved
        # issues) from App Review. Uploads, submits and changes nothing else.
        if: startsWith(env.TARGET, 'withdraw')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ "$TARGET" = withdraw-ios ]; then bundle exec fastlane ios withdraw; else bundle exec fastlane mac withdraw; fi
      - name: External testers builds
        # The TestFlight edition went up; a failed App Store edition check or build for the external testers fails the run.
        if: always() && env.EXTERNAL == 'true'
        env:
          CHECKS: ${{ steps.external_checks.outcome }}
          IOS: ${{ steps.ios_app_store.outcome }}
          MAC: ${{ steps.mac_app_store.outcome }}
        run: |
          echo "App Store edition for external testers: checks $CHECKS, iOS $IOS, macOS $MAC"
          if [ "$CHECKS" = failure ] || [ "$IOS" = failure ] || [ "$MAC" = failure ]; then
            echo "::error::The App Store edition for the external testers failed (checks $CHECKS, iOS $IOS, macOS $MAC): see its steps above. The TestFlight edition is not affected."
            exit 1
          fi
      - name: What to Test
        # Every uploaded build, both editions, gets the listing's release notes as What to Test (fastlane
        # fill_what_to_test); one that could not be set fails the run once all uploads are done.
        if: "!cancelled() && (env.TARGET == 'all' || env.TARGET == 'builds' || env.TARGET == 'ios' || env.TARGET == 'mac' || env.TARGET == 'release')"
        env:
          MISSING: ${{ steps.ios.outputs.what_to_test }} ${{ steps.mac.outputs.what_to_test }} ${{ steps.ios_app_store.outputs.what_to_test }} ${{ steps.mac_app_store.outputs.what_to_test }}
        run: |
          case "$MISSING" in
            *missing*) echo "::error::What to Test could not be set on a build of this run: see the ::error:: lines of the upload steps above."; exit 1 ;;
            *) echo "What to Test: set on every build this run uploaded." ;;
          esac
      - name: Build log
        if: failure()
        # Printed in the job log, where GitHub masks the secrets (an uploaded file would not be masked).
        run: tail -n 150 ~/Library/Logs/gym/*.log 2>/dev/null || true
      - name: Revoke this runner's development certificate
        # Signing makes Xcode create an Apple Development certificate on each new runner; its key dies with the
        # runner and Apple caps how many a team may hold (see fastlane/Fastfile). Only the certificates found in
        # this runner's keychain are revoked, matched by serial number; distribution certificates are not touched.
        if: always() && (steps.ios.outcome == 'success' || steps.ios.outcome == 'failure' || steps.mac.outcome == 'success' || steps.mac.outcome == 'failure' || steps.ios_app_store.outcome == 'success' || steps.ios_app_store.outcome == 'failure' || steps.mac_app_store.outcome == 'success' || steps.mac_app_store.outcome == 'failure')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane revoke_runner_certificates

  # After an App Store edition release, the testers get the TestFlight edition of the same code again (its build
  # numbers come after the App Store ones). Queued behind this run by the release-apple concurrency group.
  testflight:
    name: TestFlight edition again
    needs: deliver
    # The tag's own run only: the run it starts builds on the tag too and must not start another. Explicit result of
    # deliver: an implicit success() would also look at the screenshots job, which deliver needs.
    if: ${{ !cancelled() && needs.deliver.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the TestFlight edition build
        run: |
          # GitHub keeps one waiting run per group and a new one replaces it: a run already waiting (a newer tag's
          # release, a push's TestFlight builds) is never pushed out; it gives the testers a TestFlight edition build.
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 20 --json status \
            --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [ "$waiting" -gt 0 ]; then
            echo "A release.yml run is already waiting: no new one, so as not to replace it."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f target=builds -f edition=testflight

  # External testers (CLAUDE.md, App Store): the App Store edition builds the job deliver uploaded go to
  # testflight-external.yml, which waits for App Store Connect's processing and sends them through Beta App Review, never
  # App Review. A workflow of its own, with its own queue: its wait (up to 3 hours) never holds back a tag or the next
  # delivery. Also after a failed TestFlight edition: the two editions are independent.
  external:
    name: External testers
    needs: deliver
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.deliver.outputs.ios_app_store_build != '' || needs.deliver.outputs.mac_app_store_build != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_BUILD: ${{ needs.deliver.outputs.ios_app_store_build }}
      MAC_BUILD: ${{ needs.deliver.outputs.mac_app_store_build }}
    steps:
      - name: Start the external testers distribution
        run: |
          gh workflow run testflight-external.yml --repo "$GITHUB_REPOSITORY" --ref main -f ios_build="$IOS_BUILD" -f mac_build="$MAC_BUILD"
          echo "External testers: App Store edition builds iOS ${IOS_BUILD:-none}, macOS ${MAC_BUILD:-none} handed to TestFlight external."

name: Release

# Push a tag like v1.0.0 to build, sign and upload iOS + macOS builds to TestFlight and refresh the listing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to deliver
        type: choice
        default: all
        options: [all, ios, mac, metadata, metadata-ios, metadata-mac, submit, status]
      edition:
        description: "testflight: with downloads, for testers only; app-store: without downloads, the build to submit"
        type: choice
        default: testflight
        options: [testflight, app-store]
      ios_build:
        description: "submit: the iOS build number of the App Store edition, from its release run's log (empty: iOS is not submitted)"
        type: string
        default: ""
      mac_build:
        description: "submit: the macOS build number of the App Store edition, from its release run's log (empty: macOS is not submitted)"
        type: string
        default: ""

# One release at a time, whatever the tag or branch: two runs would both take the latest build number + 1 and
# collide on App Store Connect. A running upload is never cancelled; GitHub keeps one run waiting, the newest.
concurrency:
  group: release-apple
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: TestFlight / App Store Connect
    runs-on: macos-26
    timeout-minutes: 120
    # The signing secrets are given only to the steps that sign or upload, not to the tools installed or run
    # before them (gems, Homebrew, XcodeGen, which generates the project in a step of its own).
    env:
      TARGET: ${{ github.event.inputs.target || 'all' }}
      # A tag builds the App Store edition: the one that can be submitted.
      EDITION: ${{ github.event.inputs.edition || 'app-store' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See docs/RELEASE.md."
              exit 1
            fi
          done
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Core tests
        if: env.TARGET != 'status'
        working-directory: Packages/IPTVCore
        run: swift test --parallel
      - name: Demo playlist answers
        if: env.TARGET != 'status'
        # App Review taps "Try the demo": if the public list moved or broke, the review fails for a reason
        # no test sees. The address is read from the app's code.
        run: |
          URL=$(grep -o 'https://[^"]*\.m3u' App/Model/AppPaths.swift | head -1)
          curl -fsSL --retry 2 --max-time 60 "$URL" -o demo.m3u
          head -c 7 demo.m3u | grep -q '#EXTM3U' || { echo "::error::$URL is not an M3U playlist"; exit 1; }
          echo "$(grep -c '^#EXTINF' demo.m3u) entries in $URL"
      - name: App Store edition checks
        # The build to submit: nothing dormant, no private API, a listing and review notes App Review accepts
        # (.github/scripts/check_app_store.py), and the listing's addresses answer.
        if: env.EDITION == 'app-store' || startsWith(env.TARGET, 'metadata') || env.TARGET == 'all' || env.TARGET == 'submit'
        run: |
          python3 .github/scripts/check_app_store.py
          for file in fastlane/metadata/*/*_url.txt; do
            url=$(tr -d '[:space:]' < "$file")
            curl -fsSL --retry 2 --max-time 30 -o /dev/null "$url" || { echo "::error::$file: $url does not answer"; exit 1; }
          done
      - name: Privacy manifest and Mac sandbox checks
        # Every upload, TestFlight edition included: App Store Connect refuses a build that uses a required reason
        # API its privacy manifest does not declare, and the Mac app needs exactly its sandbox entitlements.
        if: env.TARGET == 'all' || env.TARGET == 'ios' || env.TARGET == 'mac' || env.TARGET == 'submit'
        run: |
          python3 .github/scripts/check_privacy_manifest.py
          python3 .github/scripts/check_mac_entitlements.py
      - name: Generate Xcode project
        # Here, without secrets, rather than in the fastlane lanes that sign and upload.
        if: env.TARGET == 'all' || env.TARGET == 'ios' || env.TARGET == 'mac'
        run: |
          brew install xcodegen || true
          xcodegen generate
      - name: iOS → TestFlight
        id: ios
        if: env.TARGET == 'all' || env.TARGET == 'ios'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane ios beta
      - name: macOS → TestFlight
        id: mac
        if: env.TARGET == 'all' || env.TARGET == 'mac'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane mac beta
      - name: App Store screenshots
        if: env.TARGET == 'all' || startsWith(env.TARGET, 'metadata') || env.TARGET == 'status'
        run: |
          # Published by the "App Store screenshots" workflow; the listing is uploaded without them otherwise.
          if git fetch -q origin appstore-screenshots; then
            mkdir -p shots fastlane/screenshots/ios fastlane/screenshots/mac
            # FETCH_HEAD: the checkout only maps main, so origin/appstore-screenshots may not exist.
            git archive FETCH_HEAD | tar -x -C shots
            if [ -d shots/mac ]; then mv shots/mac/* fastlane/screenshots/mac/ && rm -rf shots/mac; fi
            find fastlane/screenshots/mac -type f ! -name '*-mac.png' -delete
            rm -f shots/README.md
            mv shots/* fastlane/screenshots/ios/ 2>/dev/null || true
            # Screens taken when a capture test failed are diagnostics, not listing images.
            find fastlane/screenshots -type d -name failures -prune -exec rm -rf {} +
            find fastlane/screenshots -type f | sort
          fi
      - name: App Store listing
        if: env.TARGET == 'all' || startsWith(env.TARGET, 'metadata')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # A version in review cannot be edited: metadata-ios and metadata-mac update one platform only.
          if [ "$TARGET" != metadata-mac ]; then bundle exec fastlane ios metadata; fi
          if [ "$TARGET" != metadata-ios ]; then bundle exec fastlane mac metadata; fi
      # Submission for App Review, only when the user asks for it (CLAUDE.md, App Store): the listing as it is on App
      # Store Connect (target metadata first) and the App Store edition build given by number, never the latest build,
      # which may be a TestFlight edition one. Released as soon as Apple approves it.
      - name: Submit iOS for review
        id: submit_ios
        if: env.TARGET == 'submit' && github.event.inputs.ios_build != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.event.inputs.ios_build }}
        run: bundle exec fastlane ios submit
      - name: Submit macOS for review
        # Also after a failed iOS submission (the two versions are independent), never after a failed check: the
        # status functions here replace GitHub's implicit success().
        if: "!cancelled() && (success() || steps.submit_ios.outcome == 'failure') && env.TARGET == 'submit' && github.event.inputs.mac_build != ''"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.event.inputs.mac_build }}
        run: bundle exec fastlane mac submit
      - name: App Store Connect status (read only)
        # The versions of this release as App Store Connect holds them: state, selected build, review notes, and the
        # screenshots compared with today's. Prints no contact detail.
        if: env.TARGET == 'status'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane status
      - name: Build log
        if: failure()
        # Printed in the job log, where GitHub masks the secrets (an uploaded file would not be masked).
        run: tail -n 150 ~/Library/Logs/gym/*.log 2>/dev/null || true
      - name: Revoke this runner's development certificate
        # Signing makes Xcode create an Apple Development certificate on each new runner; its key dies with the
        # runner and Apple caps how many a team may hold (see fastlane/Fastfile). Only the certificates found in
        # this runner's keychain are revoked, matched by serial number; distribution certificates are not touched.
        if: always() && (steps.ios.outcome == 'success' || steps.ios.outcome == 'failure' || steps.mac.outcome == 'success' || steps.mac.outcome == 'failure')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane revoke_runner_certificates

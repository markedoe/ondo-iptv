name: Release

# Push a tag like v1.0.0 to build, sign and upload iOS + macOS builds to TestFlight and refresh the listing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to deliver
        type: choice
        default: all
        options: [all, ios, mac, metadata]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: TestFlight / App Store Connect
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      TARGET: ${{ github.event.inputs.target || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. See docs/RELEASE.md."
              exit 1
            fi
          done
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Tools
        run: brew install xcodegen || true
      - name: Core tests
        working-directory: Packages/IPTVCore
        run: swift test --parallel
      - name: Demo playlist answers
        # App Review taps "Try the demo": if the public list moved or broke, the review fails for a reason
        # no test sees. The address is read from the app's code.
        run: |
          URL=$(grep -o 'https://[^"]*\.m3u' App/Model/AppPaths.swift | head -1)
          curl -fsSL --retry 2 --max-time 60 "$URL" -o demo.m3u
          head -c 7 demo.m3u | grep -q '#EXTM3U' || { echo "::error::$URL is not an M3U playlist"; exit 1; }
          echo "$(grep -c '^#EXTINF' demo.m3u) entries in $URL"
      - name: iOS → TestFlight
        if: env.TARGET == 'all' || env.TARGET == 'ios'
        run: bundle exec fastlane ios beta
      - name: macOS → TestFlight
        if: env.TARGET == 'all' || env.TARGET == 'mac'
        run: bundle exec fastlane mac beta
      - name: App Store screenshots
        if: env.TARGET == 'all' || env.TARGET == 'metadata'
        run: |
          # Published by the "App Store screenshots" workflow; the listing is uploaded without them otherwise.
          if git fetch -q origin appstore-screenshots; then
            mkdir -p shots fastlane/screenshots/ios fastlane/screenshots/mac
            # FETCH_HEAD: the checkout only maps main, so origin/appstore-screenshots may not exist.
            git archive FETCH_HEAD | tar -x -C shots
            if [ -d shots/mac ]; then mv shots/mac/* fastlane/screenshots/mac/ && rm -rf shots/mac; fi
            find fastlane/screenshots/mac -type f ! -name '*-mac.png' -delete
            rm -f shots/README.md
            mv shots/* fastlane/screenshots/ios/ 2>/dev/null || true
            # Screens taken when a capture test failed are diagnostics, not listing images.
            find fastlane/screenshots -type d -name failures -prune -exec rm -rf {} +
            find fastlane/screenshots -type f | sort
          fi
      - name: App Store listing
        if: env.TARGET == 'all' || env.TARGET == 'metadata'
        run: |
          bundle exec fastlane ios metadata
          bundle exec fastlane mac metadata
      - name: Build log
        if: failure()
        # Printed in the job log, where GitHub masks the secrets (an uploaded file would not be masked).
        run: tail -n 150 ~/Library/Logs/gym/*.log 2>/dev/null || true

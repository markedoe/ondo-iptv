name: Android

# The short jobs (Kotlin core tests, lint, the debug APK and the release bundle, the Google Play listing's length limits)
# run once per commit on main and on pull requests: their green run is what Deliver waits for (deliver.yml). The long
# job (unit and Compose UI tests with Robolectric, screenshots with Roborazzi compared with the committed references)
# runs at night on main, only when main changed since the last night that passed it, and by hand; Google Play
# production gets only a commit it passed on (release-android.yml). Run by hand on a working branch with
# record_screenshots, it records the reference screenshots anew and commits them to that branch (docs/ANDROID.md,
# "Screenshots").
#
# The path filter is the ordered list PATHS["android"] of .github/scripts/ci_scope.py, copied byte for byte (its tests
# check it): Apple-only, documentation-only (but the shared specs docs/SYNC* and docs/PROFILES*), website-only and App
# Store listing-only changes skip it; anything else runs it: android/, the fixtures both cores read (fixtures/), the
# scripts and workflows, the Google Play listing. A run by hand on a working branch applies the same filter to the
# branch's changes since main (job "What to run", docs/CI.md).
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.*'
      - '.*/**'
      - '!App/**'
      - '!AppTests/**'
      - '!UITests/**'
      - '!MacUITests/**'
      - '!Packages/**'
      - '!project.yml'
      - '!fastlane/metadata/**'
      - '!site/**'
      - '!docs/**'
      - 'docs/SYNC*'
      - 'docs/PROFILES*'
      - '!*.md'
  pull_request:
    paths:
      - '**'
      - '.*'
      - '.*/**'
      - '!App/**'
      - '!AppTests/**'
      - '!UITests/**'
      - '!MacUITests/**'
      - '!Packages/**'
      - '!project.yml'
      - '!fastlane/metadata/**'
      - '!site/**'
      - '!docs/**'
      - 'docs/SYNC*'
      - 'docs/PROFILES*'
      - '!*.md'
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Record the reference screenshots anew and commit them to this branch (a working branch, never main or a tag)"
        type: boolean
        default: false
  # The night's run (01:47 UTC, beside CI's), on main only.
  schedule:
    - cron: '47 1 * * *'

# The runs with the long job (night, by hand) in a group of their own: a push never cancels the night's run, and the
# night never cancels a push's short run, which Deliver waits for.
concurrency:
  group: android-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'long' || 'short' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: What to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read: the earlier runs of this workflow (a night when main already passed).
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch: a run by hand compares its branch with its merge-base on main. Commits and trees only: the
          # names of the changed files need no file contents.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Heavy jobs needed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.record_screenshots }}
        # A push or a pull request: never the long job. A night or a run by hand: when unsure (an error, no main, an
        # unknown path), everything runs. A failure here fails the run.
        run: python3 -I .github/scripts/ci_scope.py scope android

  core:
    name: Core (Kotlin) tests
    # TEMPORARY (claude/tvfocus-debug): only the focus race job runs on this branch.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Every test class has HangGuard
        # A test over its time fails with every thread's stack in the log, never a silent job timeout.
        run: python3 ../.github/scripts/check_hang_guard.py
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Tests
        run: ./gradlew -p core test memoryTest --stacktrace
      - name: Test counts
        if: success() || failure()
        run: python3 ../.github/scripts/test_summary.py "Kotlin core tests" core/build/test-results
      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-test-report
          path: android/core/build/reports/tests
          if-no-files-found: ignore

  app:
    # Short: every run, the testers' builds wait for it (with the core tests and the listing limits).
    name: App — lint, debug APK, release bundle
    # TEMPORARY (claude/tvfocus-debug): only the focus race job runs on this branch.
    if: false
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint
        # --warning-mode all once in CI, in this job (it configures the app and the included core build): every
        # Gradle deprecation is named in the log, with the Gradle version that will remove it.
        run: ./gradlew :app:lintRelease --stacktrace --warning-mode all
      - name: Debug APK and release bundle
        # Signed with the debug key (no upload key here): the bundle only proves that R8 and shrinking work.
        run: ./gradlew :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-reports
          path: android/app/build/reports
          if-no-files-found: ignore
      - name: Gradle problems report
        # The deprecations and configuration problems Gradle found in the build, as Gradle writes them (HTML).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-problems-report
          path: android/build/reports/problems
          if-no-files-found: ignore
      - name: Builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  app-tests:
    # TEMPORARY (claude/tabsheader-debug): TvTabsOpenWithTheirHeaderTest only, one leg with no load, HDRTRACE printed.
    name: TV tabs header trace
    needs: scope
    if: needs.scope.outputs.run == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: TV tabs header test
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.markedoe.ondo.ui.TvTabsOpenWithTheirHeaderTest' \
            --continue --no-build-cache --stacktrace
      - name: HDRTRACE lines
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            echo "::group::$(basename "$f")"
            grep -E 'HDRTRACE|<testcase|<failure|<skipped' "$f" | sed -E 's/^[[:space:]]+//' | cut -c1-800
            echo "::endgroup::"
          done
      - name: Results artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabsheader-results
          path: android/app/build/test-results
          if-no-files-found: ignore

  screenshots:
    # Its own job: only this one can write to the repository, and it runs no Gradle or project code.
    name: Publish screenshots to the android-screenshots branch
    needs: app-tests
    # main only: the night's run, or a run by hand on main.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-screenshots
          path: screenshots
      - name: Push
        working-directory: screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find . -name "*.png" | grep -q . || { echo "::error::No screenshot to publish"; exit 1; }
          echo "Android screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > README.md
          git init -q
          git checkout -q -b android-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "Android screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-screenshots

  references:
    # Its own job: the only one that writes the reference screenshots to the repository, on the working branch the
    # workflow was run on by hand (never main, never a tag). It runs no Gradle and no app code; the token is given to
    # the push step alone.
    name: Commit the reference screenshots to the branch
    needs: app-tests
    if: github.event_name == 'workflow_dispatch' && inputs.record_screenshots && github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-screenshot-references
          path: references
      - name: No metadata in the images
        # Only the chunks that draw the image stay (the repository is public).
        run: find references -name "*.png" -print0 | xargs -0 -r python3 -I .github/scripts/png_metadata.py
      - name: Commit and push
        # The commit goes on the commit tested: if the branch moved meanwhile, the push is refused (no force).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find references -name "*.png" | grep -q . || { echo "::error::No reference screenshot recorded"; exit 1; }
          rm -rf android/app/src/test/snapshots
          mv references android/app/src/test/snapshots
          git add -A android/app/src/test/snapshots
          if git diff --cached --quiet; then
            echo "### Reference screenshots unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q \
            -m "Android: reference screenshots recorded" -m "Recorded by the Android workflow, run ${GITHUB_RUN_ID}."
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
          {
            echo "### Reference screenshots committed to \`${GITHUB_REF_NAME}\`"
            echo
            git show --stat --format="%h %s" HEAD | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

  listing:
    # Google Play rejects the whole upload when one text is too long; better to know before a release.
    name: Google Play listing limits
    # TEMPORARY (claude/tvfocus-debug): only the focus race job runs on this branch.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Text lengths
        run: |
          python3 - <<'PY'
          import pathlib, sys
          limits = {"title.txt": 30, "short_description.txt": 80, "full_description.txt": 4000}
          failed = False
          for locale in sorted(p for p in pathlib.Path("fastlane/metadata-android").iterdir() if p.is_dir()):
              files = [(locale / name, limit) for name, limit in limits.items()]
              files += [(path, 500) for path in sorted(locale.glob("changelogs/*.txt"))]
              for path, limit in files:
                  if not path.is_file():
                      print(f"::error file={path}::missing")
                      failed = True
                      continue
                  length = len(path.read_text(encoding="utf-8").rstrip("\n"))
                  print(f"{path}: {length}/{limit}")
                  if length > limit:
                      print(f"::error file={path}::{length} characters, Google Play allows {limit}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY

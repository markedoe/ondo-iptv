name: Ship

# The owner's standing go for production (CLAUDE.md): after a green night, the next version goes to review by itself,
# as a version tag would send it. .github/scripts/ship.py decides (every gate, docs/RELEASE.md) and, when they all hold,
# creates the tag vX.Y.Z on the commit the night tested and starts, from that tag, Release (target release, submit:
# iOS and macOS to App Review) and Release Android (internal testing with the listing, then closed testing for review,
# with KEEP_PLAY_REVIEW: a Google Play review in progress is never cancelled; Play catch-up follows up). A tag created
# with GITHUB_TOKEN fires no push event, so those runs are started here; a tag a human pushes starts them through its
# push. Android waits while closed testing is behind internal testing (the sign of a review). When a platform did not
# get a tagged version, a later run starts its release on that same tag (catch-up): Apple only if no Release ran on the
# tag, Google Play when it holds no bundle of the tag's run, once more at most; a failed release on the tag turns this
# run red for a human. By hand, baseline_tag and
# baseline_sha create the first version tag only, checked, and start nothing. Never bumps a version, never commits,
# never Google Play production.
on:
  # Some hours after the night's runs (ci.yml, android.yml at 01:47, which GitHub often starts hours late: 08:00 to
  # 08:51 UTC in November 2026). A night still running or a busy release queue means no ship at that time, never a
  # guess; the second time tries again, and finds the tag when the first one shipped.
  schedule:
    - cron: "17 13 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would ship: no tag, no release started (off: a real ship, from main only)"
        type: boolean
        default: true
      baseline_tag:
        description: "Baseline only: the first version tag to create (e.g. v2.0.0), equal to the apps' version at baseline_sha; nothing is started"
        type: string
        default: ""
      baseline_sha:
        description: "Baseline only: the commit on main to tag (the last one released)"
        type: string
        default: ""

permissions:
  contents: read

# One decision at a time, in a queue of its own: inside release-apple or release-android, this run would push out a
# waiting release or be pushed out by one (GitHub keeps one waiting run per group). ship.py ships only when nothing
# waits or runs in those queues.
concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    name: Next version to review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: write creates the tag; actions: write starts the release workflows (and reads the runs).
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and tag: the night's commit, the last version tag and the differences between them.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide and ship
        env:
          GH_TOKEN: ${{ github.token }}
          # A scheduled run on main is real; a run by hand is a dry run unless dry_run is off, and only main ships.
          # ship.py ships only on the literal "false".
          DRY_RUN: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))) && 'false' || 'true' }}
          # Read only (GET): which App Store versions and review submissions are under way.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # Read only, inside an edit that is deleted, never committed: the tracks and the bundles Google Play holds.
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # A run by hand only: the first version tag, checked and created alone (dry_run off, on main).
          BASELINE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_tag || '' }}
          BASELINE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_sha || '' }}
        run: python3 -I .github/scripts/ship.py

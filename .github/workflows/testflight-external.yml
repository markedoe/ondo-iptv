name: TestFlight external

# External testers (CLAUDE.md, App Store): the App Store edition builds a push's Release run uploaded (release.yml, job
# external, which alone starts this workflow: a run started by anyone else stops) go to every external TestFlight group
# of the app once App Store Connect has processed them, through Beta App Review; never App Review. The TestFlight edition
# never comes here (check_app_store.py). Linux: the wait costs no macOS minutes. Its own queue: a wait of up to 3 hours
# never holds back a tag's release or the next delivery; a newer push's builds replace builds still waiting here.
on:
  workflow_dispatch:
    inputs:
      ios_build:
        description: "The iOS App Store edition build number of a push's Release run (empty: none)"
        type: string
        default: ""
      mac_build:
        description: "The macOS App Store edition build number of a push's Release run (empty: none)"
        type: string
        default: ""

concurrency:
  group: testflight-external
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  external:
    name: External testers (Beta App Review)
    # Started by release.yml only (its GITHUB_TOKEN acts as github-actions[bot]; a re-run keeps that actor), on main.
    if: ${{ github.actor == 'github-actions[bot]' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # Up to 90 minutes of processing per platform, and Beta App Review's submission.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: iOS → external testers
        id: ios_external
        if: inputs.ios_build != ''
        env:
          EDITION: app-store
          BUILD_NUMBER: ${{ inputs.ios_build }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane ios external_testers
      - name: macOS → external testers
        # Also after a failed iOS one: the two platforms are independent.
        if: "!cancelled() && (success() || steps.ios_external.outcome == 'failure') && inputs.mac_build != ''"
        env:
          EDITION: app-store
          BUILD_NUMBER: ${{ inputs.mac_build }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane mac external_testers

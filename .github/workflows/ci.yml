name: CI

# Probe run only (branch claude/night-apple-traps): the key tests on each macOS version, whose own JSONDecoder may stop on a
# key that is not valid UTF-8. The real workflow comes back in the next commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Decoder probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick a Swift 6 Xcode
        run: |
          sw_vers
          if ! swift --version 2>&1 | grep -q 'Swift version [6-9]'; then
            XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          swift --version
      - name: Key tests after the check (one process per test)
        working-directory: Packages/IPTVCore
        run: swift test --parallel --filter 'UnreadableKeyTests|JSONListFileTests|XtreamTests|LibraryTests|SyncTests|TMDbTests|SubtitleSearchTests|AwardsTests'

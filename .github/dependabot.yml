# Update proposals: GitHub Actions and Gradle weekly, the fastlane bundle monthly. The minor and patch updates of an
# ecosystem come in one grouped pull request; a major update comes in a pull request of its own, to be read on its own.
# Gradle: /android holds the version catalog (gradle/libs.versions.toml) that the included build android/core reads
# too (its settings.gradle.kts), and core's build file names no version of its own: this one entry covers both.
# Swift packages are not listed: IPTVCore has no dependency, and the Apple app's packages (VLCKit, Nuke, Google
# Cast) are pinned in project.yml, which Dependabot cannot read: bump them by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      fastlane:
        patterns: ["*"]
        update-types: [minor, patch]

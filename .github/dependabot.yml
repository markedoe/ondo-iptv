# Weekly update proposals, one grouped pull request per ecosystem. The Apple packages (VLCKit, Nuke,
# Google Cast) are pinned in project.yml, which Dependabot cannot read: bump them by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly

# Update proposals, one grouped pull request per ecosystem: GitHub Actions and Gradle weekly, the fastlane
# bundle monthly. Swift packages are not listed: IPTVCore has no dependency, and the Apple app's packages
# (VLCKit, Nuke, Google Cast) are pinned in project.yml, which Dependabot cannot read: bump them by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      fastlane:
        patterns: ["*"]

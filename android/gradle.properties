org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# Each deprecated Gradle feature is printed with where it comes from, so the causes are known before Gradle 10.
org.gradle.warning.mode=all
# Configuration cache: a build that ran once with the same scripts, properties and environment skips configuration.
org.gradle.configuration-cache=true

name: Ondo
options:
  bundleIdPrefix: com.markedoe
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  IPTVCore:
    path: Packages/IPTVCore
  # VLCKit 3.6 (LGPL) as a second engine for MKV, AVI, raw MPEG-TS and codecs AVFoundation cannot play.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
  # Image loading and caching (memory + disk, downsampling) for logos and posters.
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 12.8.0
  # Official Google Cast SDK (Chromecast), packaged for SPM by SRG SSR. iOS only.
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    exactVersion: 4.8.6

targets:
  Ondo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Resources/*.entitlements"
    dependencies:
      - package: IPTVCore
      - package: VLCKitSPM
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: GoogleCast
        destinationFilters: [iOS]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ondo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        # IPTV providers overwhelmingly serve plain HTTP playlists, APIs, guides, streams and logos.
        # NSAllowsArbitraryLoads alone: adding ...ForMedia, ...InWebContent or NSAllowsLocalNetworking
        # makes the system ignore it, and every non-media HTTP request fails (AppTransportSecurityTests).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Ondo looks for Chromecast and AirPlay devices on your network so you can watch on a TV or projector, and plays streams served from your local network.
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleLocalizations: [en, fr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markedoe.ondo
        PRODUCT_NAME: Ondo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/Ondo-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/Ondo-macOS-Debug.entitlements

  OndoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: AppTests
    dependencies:
      - target: Ondo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markedoe.ondo.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  OndoUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
      # The playlist test serves its playlist from the test runner, on the same simulator.
      - path: AppTests/LocalHTTPServer.swift
    dependencies:
      - target: Ondo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markedoe.ondo.uitests
        TEST_TARGET_NAME: Ondo
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  OndoMacUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources:
      - path: MacUITests
    dependencies:
      - target: Ondo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markedoe.ondo.macuitests
        TEST_TARGET_NAME: Ondo
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ondo:
    build:
      targets:
        Ondo: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Ondo
      targets:
        - OndoTests
        - OndoUITests
    archive:
      config: Release

  # Mac App Store screenshots only (App Store screenshots workflow).
  OndoMacScreenshots:
    build:
      targets:
        Ondo: all
        OndoMacUITests: [test]
    test:
      config: Debug
      targets:
        - OndoMacUITests
